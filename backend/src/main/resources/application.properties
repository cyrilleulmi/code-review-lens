# CodeReviewLens backend
quarkus.application.name=code-review-lens
quarkus.http.port=8080
# Local tool: only listen on localhost (the Docker image overrides this with 0.0.0.0)
quarkus.http.host=127.0.0.1
quarkus.banner.enabled=false

# Data directory (snapshots, analysis, marks). Env: SCR_DATA_DIR. Default: ~/.code-review-lens
# scr.data-dir=
# GitHub token. Env: GITHUB_TOKEN or GH_TOKEN; fallback: `gh auth token`
# scr.github.token=
# GitLab (gitlab.com or self-managed). Env: SCR_GITLAB_URL, GITLAB_TOKEN or GL_TOKEN (scope "api");
# fallback: `glab config get token`. Without a token, public merge requests can still be opened by URL.
# scr.gitlab.url=https://gitlab.com
# scr.gitlab.token=
# Self-managed GitLab behind an SSO proxy (e.g. Pritunl Zero): the session cookies of the proxy, sent as the Cookie
# header with every GitLab request, in addition to the token ("name=value; name2=value2"). Env: SCR_GITLAB_COOKIE.
# scr.gitlab.cookie=
# These three are the startup configuration. The "Verbindungen" section of the UI (top of the pull request list) can override each of them while running; what
# it saves goes to <data>/connections.json and takes precedence field by field (also after a restart). Without that
# file, nothing changes. "Auf Startkonfiguration zurücksetzen" removes the entry again.

# TLS: certificates trusted in addition to the default ones of the runtime (its cacerts, or javax.net.ssl.trustStore),
# e.g. the root certificate of a company CA in front of a self-managed GitLab. PEM files (one or several certificates
# each) or directories with such files (*.pem, *.crt, *.cer, *.der), comma separated. Env: SCR_TLS_CA_CERTS.
# Also trusted: every certificate file in <data>/certificates (the UI saves there; files put there by hand apply after
# "Neu einlesen" in the UI or the next start).
# scr.tls.ca-certs=/etc/ssl/firma/root-ca.pem
# Insecure way out: hosts (host or host:port) whose certificate is not checked at all. Env: SCR_TLS_INSECURE_HOSTS.
# The UI can switch the check off per host as well (saved in <data>/tls.json).
# scr.tls.insecure-hosts=

quarkus.native.resources.includes=rules/*.json,data-dir/*

# Browser caching, so that a new build never needs a cache reset: hashed build files (main-AB12CD34.js,
# media/inter-…-AB12CD34.woff2) never change and are cached forever; everything else (index.html, licenses)
# is revalidated on every load; API responses are never stored.
quarkus.http.filter.static-hashed.matches=/(?:media/)?[^/]+-[A-Z0-9]{8}\\.[a-z0-9]+
quarkus.http.filter.static-hashed.header."Cache-Control"=public, max-age=31536000, immutable
quarkus.http.filter.static-other.matches=/(?!api/)(?!(?:media/)?[^/]+-[A-Z0-9]{8}\\.[a-z0-9]+$).*
quarkus.http.filter.static-other.header."Cache-Control"=no-cache
quarkus.http.filter.api.matches=/api/.*
quarkus.http.filter.api.header."Cache-Control"=no-store
quarkus.log.category."dev.codereviewlens".level=INFO

# Angular dev server (ng serve) proxies /api to us; no CORS needed.
